[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneglass"
version = "0.1.0"
description = "A local-first Windows desktop foundation for AI image generation."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "licenses/README.md"]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.gui-scripts]
stoneglass = "stoneglass.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stoneglass.ui" = ["*.qss", "assets/*.jpg", "assets/*.md"]
